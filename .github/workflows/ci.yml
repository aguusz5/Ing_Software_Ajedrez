# Corre todos los tests en cada push y en cada pull request.
# Si algo queda en rojo, GitHub marca el commit con una cruz y avisa.
name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y correr los tests
        run: mvn -B test
